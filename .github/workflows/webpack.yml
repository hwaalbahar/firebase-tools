name: NodeJS with Webpack

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق NeuroCore AI - مستقبلك الرقمي يبدأ هنا</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    
    <style>
        /* CSS Variables for Theming */
        :root {
            --gradient: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            --font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --primary: #1a73e8;
            --secondary: #0d47a1;
            --accent: #00c853;
            --bg-color: #0a192f;
            --text-color: #f5f8ff;
            --slate: #a0aec0;
            --card-bg: rgba(25, 42, 86, 0.5);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="light"] {
            --primary: #1a73e8;
            --secondary: #e3f2fd;
            --accent: #00c853;
            --bg-color: #f0f2f5;
            --text-color: #1c1e21;
            --slate: #555;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
        }
        
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }
        
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        section { padding: 100px 0; }
        
        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .section-title h2 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        
        .section-title h2 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .section-title p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: var(--slate);
        }
        
        /* Header */
        header {
            padding: 20px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            color: var(--text-color);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
        }
        
        .nav-links li { margin-left: 30px; }
        
        .nav-links a {
            color: var(--slate);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        .theme-switcher {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .theme-switcher:hover {
            background: var(--primary);
            color: white;
            transform: rotate(180deg);
        }
        
        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.3;
        }
        
        .hero .typed-text {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero p {
            font-size: 1.5rem;
            max-width: 800px;
            margin: 20px auto 40px;
            color: var(--slate);
        }

        .cta-button {
            background: var(--primary);
            color: white;
            padding: 14px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(26, 115, 232, 0.4);
        }

        /* AI Playground Section */
        #playground {
            background: var(--secondary);
        }
        .terminal {
            background: #000;
            border-radius: 10px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            font-family: 'Courier New', Courier, monospace;
        }
        .terminal-header {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        .terminal-header .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .terminal-output {
            height: 400px;
            overflow-y: auto;
            color: #f0f0f0;
            line-height: 1.6;
            margin-top: 10px;
        }
        .terminal-output .prompt { color: #00c853; }
        .terminal-output .command { color: white; }
        .terminal-output .response { color: #1a73e8; }

        .terminal-input { display: flex; align-items: center; margin-top: 10px; }
        .terminal-input label { color: #00c853; margin-left: 5px; }
        .terminal-input input {
            background: transparent;
            border: none;
            color: white;
            flex-grow: 1;
            font-size: 1rem;
            font-family: 'Courier New', Courier, monospace;
        }
        .terminal-input input:focus { outline: none; }
        
        /* Skeleton Loader for AI Response */
        .skeleton {
            background: #333;
            border-radius: 4px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { background-color: #333; }
            50% { background-color: #444; }
            100% { background-color: #333; }
        }
        .skeleton.title { width: 40%; height: 20px; margin-bottom: 15px; }
        .skeleton.line { width: 90%; height: 12px; margin-bottom: 10px; }
        .skeleton.line-sm { width: 70%; height: 12px; margin-bottom: 10px; }

        /* Projects Section & Modal */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .project-card:hover { transform: translateY(-10px); }
        .project-card h3 { font-size: 1.5rem; }
        .project-card p { color: var(--slate); margin: 10px 0 20px; flex-grow: 1;}
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            position: relative;
            transform: scale(0.8);
            transition: all 0.4s ease;
        }
        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }
        .modal-close {
            position: absolute;
            top: 15px; left: 15px;
            background: var(--card-bg);
            border: none;
            color: var(--text-color);
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">NeuroCore</a>
                <ul class="nav-links">
                    <li><a href="#hero" class="active">الرئيسية</a></li>
                    <li><a href="#playground">التطبيق</a></li>
                    <li><a href="#projects">المشاريع</a></li>
                    <li><button class="theme-switcher" id="theme-switcher" aria-label="تبديل المظهر"><i class="fas fa-sun"></i></button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="container" data-aos="fade-up">
                <h1>
                    تطبيق NeuroCore AI:
                    <br>
                    <span id="typed-hero" class="typed-text"></span>
                </h1>
                <p>لم تعد صفحة هبوط، بل بوابة تفاعلية لإطلاق العنان لقدرات الذكاء الاصطناعي. جرب بنفسك.</p>
                <a href="#playground" class="cta-button">جرب التطبيق الآن <i class="fas fa-arrow-down" style="margin-right: 5px;"></i></a>
            </div>
        </section>

        <section id="playground">
            <div class="container">
                <div class="section-title" data-aos="fade-up">
                    <h2><span>جرب</span> قوة NeuroCore AI مباشرة</h2>
                    <p>أعطِ أمرًا للتطبيق وشاهد كيف يحول أفكارك إلى خطط منظمة في ثوانٍ. جرب "موقع لبيع الزهور" أو "تطبيق للياقة البدنية".</p>
                </div>
                <div class="terminal" data-aos="zoom-in">
                    <div class="terminal-header">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                    <div class="terminal-output" id="terminal-output">
                        <div><span class="prompt">[NeuroCore]:</span> مرحبًا بك في الواجهة التفاعلية. ماذا يمكنني أن أبني لك اليوم؟</div>
                    </div>
                    <div class="terminal-input">
                        <label for="terminal-cmd">></label>
                        <input type="text" id="terminal-cmd" placeholder="اكتب أمرك هنا واضغط Enter..." autocomplete="off">
                    </div>
                </div>
            </div>
        </section>

        <section id="projects" class="projects">
            <div class="container">
                <div class="section-title" data-aos="fade-up">
                    <h2><span>مشاريع</span> تم توليدها بواسطة التطبيق</h2>
                    <p>هذه ليست مجرد صور، بل هي مشاريع تم تحليلها وتخطيطها بواسطة NeuroCore AI. اضغط لعرض التفاصيل.</p>
                </div>
                <div class="projects-grid">
                    <div class="project-card" data-aos="fade-up" data-project-id="1" data-title="متجر TechNova الإلكتروني" data-desc="منصة تجارة إلكترونية متخصصة في بيع أحدث الأجهزة التقنية، مع نظام توصيات ذكي يعتمد على تحليل سلوك المستخدم.">
                        <h3>متجر TechNova الإلكتروني</h3>
                        <p>منصة تجارة إلكترونية ذكية...</p>
                        <button class="cta-button">عرض التحليل البياني</button>
                    </div>
                     <div class="project-card" data-aos="fade-up" data-aos-delay="100" data-project-id="2" data-title="منصة DataViz لتحليل البيانات" data-desc="نظام متكامل لتحليل البيانات الضخمة وتقديم تقارير تنبؤية دقيقة، مع لوحات تحكم تفاعلية تمكن صناع القرار من فهم التوجهات بسهولة.">
                        <h3>منصة DataViz للبيانات</h3>
                        <p>نظام متكامل لتحليل البيانات...</p>
                        <button class="cta-button">عرض التحليل البياني</button>
                    </div>
                     <div class="project-card" data-aos="fade-up" data-aos-delay="200" data-project-id="3" data-title="تطبيق FitLife للياقة" data-desc="تطبيق جوال يجمع بين خطط التمارين المخصصة والتغذية الذكية، مع مدرب افتراضي يتكيف مع أداء المستخدم ويقدم له الدعم والتحفيز.">
                        <h3>تطبيق FitLife للياقة</h3>
                        <p>تطبيق جوال ذكي ومتكامل...</p>
                        <button class="cta-button">عرض التحليل البياني</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div class="modal-overlay" id="project-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close-btn"><i class="fas fa-times"></i></button>
            <h2 id="modal-title"></h2>
            <p id="modal-desc" style="margin: 15px 0; color: var(--slate);"></p>
            <canvas id="project-chart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // --- App Module ---
        const App = (() => {
            let chartInstance;

            const DOM = {
                themeSwitcher: document.getElementById('theme-switcher'),
                themeIcon: document.querySelector('#theme-switcher i'),
                terminalOutput: document.getElementById('terminal-output'),
                terminalInput: document.getElementById('terminal-cmd'),
                projectCards: document.querySelectorAll('.project-card button'),
                modalOverlay: document.getElementById('project-modal'),
                modalCloseBtn: document.getElementById('modal-close-btn'),
                modalTitle: document.getElementById('modal-title'),
                modalDesc: document.getElementById('modal-desc'),
                chartCanvas: document.getElementById('project-chart'),
            };

            const THEMES = {
                LIGHT: 'light',
                DARK: 'dark'
            };

            const initTheme = () => {
                const savedTheme = localStorage.getItem('theme') || THEMES.DARK;
                document.documentElement.setAttribute('data-theme', savedTheme);
                DOM.themeIcon.className = savedTheme === THEMES.DARK ? 'fas fa-sun' : 'fas fa-moon';
            };

            const toggleTheme = () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === THEMES.DARK ? THEMES.LIGHT : THEMES.DARK;
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                DOM.themeIcon.className = newTheme === THEMES.DARK ? 'fas fa-sun' : 'fas fa-moon';
            };

            const initTyped = () => {
                new Typed('#typed-hero', {
                    strings: ['يبني تطبيقاتك.', 'يصمم واجهاتك.', 'يدير مشاريعك.'],
                    typeSpeed: 50,
                    backSpeed: 30,
                    loop: true,
                    smartBackspace: true,
                });
            };

            const handleTerminalCommand = (e) => {
                if (e.key === 'Enter' && e.target.value.trim() !== '') {
                    const command = e.target.value.trim();
                    e.target.value = '';

                    // Display user command
                    const userLine = `<div><span class="prompt">></span> <span class="command">${command}</span></div>`;
                    DOM.terminalOutput.innerHTML += userLine;
                    
                    // Show thinking state
                    const thinkingLine = `
                        <div>
                            <span class="prompt">[NeuroCore]:</span> جاري تحليل طلبك...
                            <div class="skeleton-container" style="padding: 10px 0;">
                                <div class="skeleton title"></div>
                                <div class="skeleton line"></div>
                                <div class="skeleton line-sm"></div>
                            </div>
                        </div>`;
                    DOM.terminalOutput.innerHTML += thinkingLine;
                    DOM.terminalOutput.scrollTop = DOM.terminalOutput.scrollHeight;

                    setTimeout(() => {
                        // Remove skeleton
                        const skeletons = DOM.terminalOutput.querySelectorAll('.skeleton-container');
                        skeletons[skeletons.length - 1].parentElement.remove();
                        
                        // Generate and show response
                        const response = generateAIResponse(command);
                        const responseLine = `<div><span class="prompt">[NeuroCore]:</span> <span class="response">${response}</span></div>`;
                        DOM.terminalOutput.innerHTML += responseLine;
                        DOM.terminalOutput.scrollTop = DOM.terminalOutput.scrollHeight;
                    }, 2000);
                }
            };

            const generateAIResponse = (command) => {
                const lowerCmd = command.toLowerCase();
                if (lowerCmd.includes('موقع') || lowerCmd.includes('website')) {
                    return `
                        تم إنشاء خطة لمشروع: <strong>موقع ويب احترافي</strong>
                        <ul>
                            <li><strong>لوحة الألوان:</strong> #0D47A1 (أزرق داكن), #42A5F5 (أزرق فاتح), #FFFFFF (أبيض)</li>
                            <li><strong>الميزات الرئيسية:</strong> صفحة رئيسية جذابة, قسم للخدمات, معرض أعمال, صفحة اتصل بنا.</li>
                            <li><strong>التقنيات المقترحة:</strong> HTML5, CSS3, JavaScript, AOS للأنيميشن.</li>
                        </ul>
                    `;
                }
                if (lowerCmd.includes('شعار') || lowerCmd.includes('logo')) {
                     return `
                        تم إنشاء فكرة لشعار: <strong>شعار عصري</strong>
                        <ul>
                            <li><strong>المفهوم:</strong> دمج شكل الدماغ مع الدوائر الإلكترونية.</li>
                            <li><strong>الألوان:</strong> تدرجات الأزرق مع لمسة من الأخضر النيون (var-accent).</li>
                            <li><strong>النمط:</strong> تصميم بسيط (Minimalist) يعكس الذكاء والتقنية.</li>
                        </ul>
                    `;
                }
                if (lowerCmd.includes('تطبيق') || lowerCmd.includes('app')) {
                     return `
                        تم إنشاء خطة لمشروع: <strong>تطبيق جوال</strong>
                        <ul>
                            <li><strong>الفكرة:</strong> تطبيق لتنظيم المهام يعتمد على الذكاء الاصطناعي لترتيب الأولويات.</li>
                            <li><strong>المنصات:</strong> iOS و Android.</li>
                            <li><strong>الميزات:</strong> إدخال المهام بالصوت، إشعارات ذكية، تقارير إنتاجية.</li>
                        </ul>
                    `;
                }
                return "عذرًا، لم أتعرف على هذا النوع من المشاريع. هل يمكنك تجربة أمر آخر؟";
            };

            const openModal = (e) => {
                const card = e.currentTarget.parentElement;
                const title = card.getAttribute('data-title');
                const desc = card.getAttribute('data-desc');

                DOM.modalTitle.textContent = title;
                DOM.modalDesc.textContent = desc;
                
                DOM.modalOverlay.classList.add('visible');
                createChart();
            };

            const closeModal = () => {
                DOM.modalOverlay.classList.remove('visible');
                if (chartInstance) {
                    chartInstance.destroy();
                }
            };
            
            const createChart = () => {
                 if (chartInstance) chartInstance.destroy();

                const sampleData = {
                    labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
                    datasets: [{
                        label: 'تفاعل المستخدمين (بالآلاف)',
                        data: [12, 19, 3, 5, 6, 9].map(() => Math.floor(Math.random() * 20)),
                        borderColor: 'rgba(26, 115, 232, 1)',
                        backgroundColor: 'rgba(26, 115, 232, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                };

                chartInstance = new Chart(DOM.chartCanvas, {
                    type: 'line',
                    data: sampleData,
                    options: {
                        responsive: true,
                        scales: { y: { beginAtZero: true } }
                    }
                });
            };

            const initEventListeners = () => {
                DOM.themeSwitcher.addEventListener('click', toggleTheme);
                DOM.terminalInput.addEventListener('keydown', handleTerminalCommand);
                DOM.projectCards.forEach(btn => btn.addEventListener('click', openModal));
                DOM.modalCloseBtn.addEventListener('click', closeModal);
                DOM.modalOverlay.addEventListener('click', (e) => {
                    if (e.target === DOM.modalOverlay) closeModal();
                });
            };

            return {
                init: () => {
                    AOS.init({ duration: 800, once: true, offset: 50 });
                    initTheme();
                    initTyped();
                    initEventListeners();
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
